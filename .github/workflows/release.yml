name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { path: plugin }

      - name: Check out HardwareKit
        uses: actions/checkout@v4
        with: { repository: thenameiscobmarley/HardwareKit, path: HardwareKit }

      - name: Check out JUCE
        uses: actions/checkout@v4
        with: { repository: juce-framework/JUCE, ref: master, path: JUCE }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
            libcurl4-openssl-dev libgtk-3-dev

      - name: Build and test
        run: |
          cmake -S plugin -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DJUCE_PATH=$GITHUB_WORKSPACE/JUCE \
            -DHARDWAREKIT_PATH=$GITHUB_WORKSPACE/HardwareKit
          cmake --build build
          build/EnhDspTests_artefacts/Release/EnhDspTests

      - name: Package
        run: plugin/scripts/package-release.sh "${{ github.ref_name }}" build plugin dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  windows:
    runs-on: windows-2022
    needs: linux   # the Linux job creates the release; this one adds to it
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { path: plugin }

      - name: Check out HardwareKit
        uses: actions/checkout@v4
        with: { repository: thenameiscobmarley/HardwareKit, path: HardwareKit }

      - name: Check out JUCE
        uses: actions/checkout@v4
        with: { repository: juce-framework/JUCE, ref: master, path: JUCE }

      - name: Configure
        run: cmake -S plugin -B build -G "Visual Studio 17 2022" -A x64 -DENH_COPY_PLUGIN=OFF -DENH_BUILD_TOOLS=OFF "-DJUCE_PATH=${{ github.workspace }}/JUCE" "-DHARDWAREKIT_PATH=${{ github.workspace }}/HardwareKit"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Offline DSP tests
        run: build/EnhDspTests_artefacts/Release/EnhDspTests.exe

      - name: Package
        run: plugin/scripts/package-release-windows.ps1 -Version "${{ github.ref_name }}" -Build build -Source plugin -Dist dist

      - name: Add to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  checksums:
    # After both builds: SHA-256 of every download and every script people run, as one file on the
    # release, so anyone can check that what they downloaded is exactly what was built here
    runs-on: ubuntu-22.04
    needs: [linux, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { path: plugin }

      - name: Fingerprint the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir sums && cd sums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip'
          cp ../plugin/build.sh ../plugin/convert-to-windows.bat .
          cp ../plugin/scripts/*.sh ../plugin/scripts/*.ps1 .
          sha256sum -- *.zip *.sh *.bat *.ps1 | sort -k2 > SHA256SUMS.txt
          cat > HOW-TO-CHECK.txt <<'TXT'
          How to check a download is the real one
          =======================================
          SHA256SUMS.txt lists a fingerprint (SHA-256) for every download on this release and for every
          script in the repository people run (build.sh, convert-to-windows.bat, the scripts/ folder).
          Work out the fingerprint of your copy and compare it with the line for that file: if even one
          character differs, the file is not the one GitHub built here - don't run it.

          Windows (PowerShell):   Get-FileHash .\ENH-Master-...-windows-gamer-app.zip -Algorithm SHA256
          Windows (cmd):          certutil -hashfile ENH-Master-...-windows-gamer-app.zip SHA256
          Linux / macOS:          sha256sum -c SHA256SUMS.txt --ignore-missing

          Inside every zip, CHECKSUMS.txt does the same for the files in it (ENH Master.exe, the plugin).
          TXT
          sed -i 's/^          //' HOW-TO-CHECK.txt
          gh release upload "$TAG" SHA256SUMS.txt HOW-TO-CHECK.txt --repo "$GITHUB_REPOSITORY" --clobber
